<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System｜Kaleido Web</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="intro">
      <p>Drawing the <span class="intro_highlight">Solar System</span> with the Archimedean Spiral</p>
    </div>
    <main>
      <p class="title_text">Drawing the <span style="color: #FF3F0B;">Solar System</span> with the Archimedean Spiral</p>
      <p class="body_text">The spiral structure is intertwined with the <span style="color: #52cc47;">natural world.</span></p>
      <p class="code_link"><a href="https://github.com/sian-ka-suiso/r-a----Solar-System" target="_blank" rel="noopener">Code on GitHub ↗</a></p>
    </main>
    <script src="sketch.js"></script>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      function scrollToCenter(tries = 60) {
        const canvas = document.querySelector('canvas');
        if (!canvas || canvas.offsetHeight === 0) {
          if (tries > 0) requestAnimationFrame(() => scrollToCenter(tries - 1));
          return;
        }
        const top = (canvas.offsetHeight - window.innerHeight) / 2;
        window.scrollTo(0, Math.max(0, top));

        const intro = document.getElementById('intro');
        if (!intro) return;
        setTimeout(() => intro.classList.add('highlight'), 450);
        setTimeout(() => {
          intro.classList.add('fade-out');
          intro.addEventListener('transitionend', () => intro.remove(), { once: true });
        }, 1800);
      }

      window.addEventListener('pageshow', () => {
        setTimeout(() => scrollToCenter(), 0);
      });
    </script>
  </body>
</html>
